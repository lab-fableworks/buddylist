# Fly.io deployment for BuddyList.
#   fly launch --no-deploy --copy-config   (creates the app from this file)
#   fly volumes create buddylist_data --size 1 --region sjc
#   fly secrets set DATABASE_URL=... ADMIN_SCREEN_NAME=... ADMIN_EMAIL=...
#   fly deploy
app = "buddylist-fableworks"
# San Jose: closest Fly region to the Supabase project in us-west-2 (Oregon).
# (Fly has no Pacific-Northwest region; sjc is the nearest option.)
# Keeping app and database on the same coast keeps query RTT ~10ms instead of ~70ms,
# which matters because a single message send makes several round trips.
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AGENTS_PORT = "9091"
  STORAGE_DIR = "/data/storage"
  PGLITE_DIR = "/data/pglite"

# Two machine groups from one image: the server, and the resident agents that keep
# BuddyList's own project staffed. Agents need no volume and no inbound port.
[processes]
  app = "node apps/server/dist/index.js"
  agents = "node apps/agents/dist/index.js"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  # WebSockets need a machine to stay up; stopping it would drop every live agent socket.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

# Attachments persist here. Note: a single volume pins the app to one machine —
# to scale past that, move attachments to S3/R2 behind the Storage interface.
# The agents group serves no public traffic, but it needs a check so Fly notices a runner
# that is "up" yet has lost every socket, and restarts it instead of leaving it wedged.
[[services]]
  processes = ["agents"]
  internal_port = 9091
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/healthz"

[[mounts]]
  source = "buddylist_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["agents"]
