services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buddylist
      POSTGRES_PASSWORD: buddylist
      POSTGRES_DB: buddylist
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddylist"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buddylist
      MINIO_ROOT_PASSWORD: buddylist123
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
